[package]
name = "safe-txt"
version = "0.1.0"
edition = "2024"
description = "A simple encrypted text vault using age (X25519)"
license = "MIT"
readme = "README.md"
default-run = "safe-txt"

[[bin]]
name = "safe-txt"
path = "src/main.rs"

[[bin]]
name = "safe-txt-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
age = { version = "0.12.1", features = ["armor", "cli-common"] }
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
rpassword = "7.5.4"
tempfile = "3.27.0"
zeroize = { version = "1.9.0", features = ["derive"] }
eframe = { version = "0.35.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.35.0", optional = true }
rfd = { version = "0.17.2", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:rfd"]
